<!--
  Favicon. O <link rel="icon"> do Layout aponta para este arquivo.

  Desenho: um "arco de pão" simplificado — meia-lua com uma linha de
  gergelim, legível mesmo em 16px (onde uma letra em serifa fina vira
  borrão). Cores literais (#17140f fundo, #e08a3c laranja-queimado) porque
  SVG de favicon carrega fora da página — não há var(--color-*) aqui. Ao
  mexer na paleta, mexer aqui junto.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#17140f"/>
  <path d="M12 34c4-14 36-14 40 0" fill="none" stroke="#e08a3c" stroke-width="5" stroke-linecap="round"/>
  <circle cx="24" cy="26" r="2.2" fill="#e08a3c"/>
  <circle cx="32" cy="23" r="2.2" fill="#e08a3c"/>
  <circle cx="40" cy="26" r="2.2" fill="#e08a3c"/>
</svg>
